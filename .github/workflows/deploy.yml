name: Deploy Theseus Workshop Engine to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Disabled npm Cache Setup (no cache parameter)
          # to prevent "Dependencies lock file is not found" runner error.

      - name: Check Node and NPM Version
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Deploy to GitHub Pages Branch (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
